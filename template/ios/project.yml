# THE APP ON AN iPHONE: `ios/build.sh` (the app's Scala into lib/App.xcframework), then `xcodegen` here and open
# Counter.xcodeproj — choose your team under Signing to run on your own phone. Not `App`: a module of that name
# hides SwiftUI's `App`, and Xcode then links SwiftUICore by itself — the app ends at launch on iOS 18
name: Counter
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
packages:
  OkayFaces:
    url: https://github.com/okay-effects/okay-faces
    from: 0.1.0
targets:
  Counter:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: OkayFaces
      - framework: lib/App.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: App
        # what the phone says when the app first asks for these (the app's `locate`, `takePhoto`, `verify`)
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: The app notes where you are when you ask it to.
        INFOPLIST_KEY_NSCameraUsageDescription: The app takes a photo when you ask it to.
        INFOPLIST_KEY_NSFaceIDUsageDescription: The app checks that it is you when you ask it to.
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        OTHER_LDFLAGS: [-lc++]
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        SWIFT_VERSION: "5.0"
