# an okay-faces application on Cloudflare Workers: `npx wrangler dev`, `npx wrangler deploy`
# main.js: the application's Cloudflare main, linked as an ES module (fullLinkJS), copied beside entry.js;
# page.js.txt: the thin page's script (okay.faces.laminar.RemotePage, linked), if the application has it
name = "okay-faces-todo"
main = "entry.js"
compatibility_date = "2026-10-01"
rules = [{ type = "Text", globs = ["**/*.txt"], fallthrough = true }]

[[durable_objects.bindings]]
name = "OKAY_FACES_SESSIONS"
class_name = "OkayFacesSession"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["OkayFacesSession"]
