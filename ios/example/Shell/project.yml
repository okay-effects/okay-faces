# the examples' shell, for XcodeGen: `xcodegen` here makes Shell.xcodeproj (not kept) — after `ios/build.sh` put
# the examples' Scala, for the simulator and a device, into lib/OkayExample.xcframework
name: Shell
options:
  bundleIdPrefix: io.github.okay-effects
  deploymentTarget:
    iOS: "17.0"
packages:
  OkayFaces:
    path: ../../..
targets:
  Shell:
    type: application
    platform: iOS
    sources: [Shell]
    dependencies:
      - package: OkayFaces
      - framework: lib/OkayExample.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.okay-effects.faces.shell
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: okay-faces
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        OTHER_LDFLAGS: [-lc++]
        # the library is arm64's: an Apple silicon simulator, a device
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_VERSION: "5.0"
  ShellUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ShellUITests]
    dependencies:
      - target: Shell
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.okay-effects.faces.shell.uitests
        GENERATE_INFOPLIST_FILE: YES
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        SWIFT_VERSION: "5.0"
schemes:
  Shell:
    build:
      targets:
        Shell: all
    test:
      targets: [ShellUITests]
